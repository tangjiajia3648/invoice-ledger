function pcInvoiceOrders(invoice){const orders=[],seen=new Set();for(const line of invoice.lines){const meta=line.registrationMeta,card=meta?.cards?.find(c=>c.number===invoice.number);if(card){if(seen.has(card))continue;seen.add(card);orders.push(...(card.orders||[]));}else if(line.order){orders.push({code:line.order,amount:line.amount,products:[]});}}return orders;}

 const tabs=[{id:'goods',label:'商品明细'},{id:'register',label:'关联进项登记单详情'},{id:'orders',label:'关联订单详情'}];let active='goods';

  $('#pc-ledger-tabs').innerHTML=tabs.map(t=>'<span class="pc-original-tab '+(t.id===active?'active':'')+'"><button data-ledger-detail-tab="'+t.id+'">'+t.label+'</button>'+(t.registration?'<button data-ledger-close-tab="'+t.id+'" aria-label="关闭登记详情">×</button>':'')+'</span>').join('');
  document.querySelectorAll('[data-ledger-detail-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.ledgerDetailTab;draw();});document.querySelectorAll('[data-ledger-close-tab]').forEach(b=>b.onclick=()=>{tabs.splice(tabs.findIndex(t=>t.id===b.dataset.ledgerCloseTab),1);active='register';draw();});
  const panel=$('#pc-ledger-panel'),tab=tabs.find(t=>t.id===active);
  if(tab.registration){renderPCRegistration(invoice,tab.registration,panel);return;}
  if(active==='orders'){panel.innerHTML=pcRelatedOrderHTML(pcInvoiceOrders(invoice),invoice);return;}
  if(active==='goods'){
   const names=['序号','货物或应税劳务名称','规格型号','税收分类编码','数量','单位','未税单价','未税金额','税率（%）','税额','价税合计'],products=invoice.collectedProducts||[];
   panel.innerHTML='<div class="pc-original-scroll"><table class="small-table pc-original-products"><thead><tr>'+names.map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+products.map((p,i)=>'<tr>'+[i+1,p.itemName,p.specifications,p.taxCode,p.quantity,p.unit,pcDetailMoney(p.price),pcDetailMoney(p.amount),p.taxRate,pcDetailMoney(p.taxAmount),pcDetailMoney(p.totalAmount)].map(v=>'<td>'+pcDetailValue(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(products.length?'':'<div class="pc-original-empty">暂无数据</div>')+'</div>';return;
  }
  const ids=[...new Set(invoice.lines.map(l=>l.id))],names=['序号','单据编号','供应商','业务员','发票状态','发票类别','总金额','制单员','制单时间','备注'];
  panel.innerHTML='<div class="pc-original-scroll"><table class="small-table pc-original-products"><thead><tr>'+names.map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+ids.map((id,i)=>{const lines=invoice.lines.filter(l=>l.id===id),meta=lines.find(l=>l.registrationMeta)?.registrationMeta||{};return '<tr><td>'+(i+1)+'</td><td><button class="link" data-pc-ledger-registration="'+ticketEscape(id)+'">'+ticketEscape(id)+'</button></td>'+[meta.supplier||invoice.seller,meta.agent,registrationDocumentState(lines.map(l=>l.state)),meta.category,money(lines.reduce((n,l)=>n+Number(l.amount),0)),meta.creator,meta.created,meta.remark].map(v=>'<td>'+pcDetailValue(v)+'</td>').join('')+'</tr>';}).join('')+'</tbody></table></div>';

function ledgerSnapshot(invoice){
 const a=amounts(invoice);
 return {number:invoice.number,info:{...(invoice.ticketInfo||{})},type:invoice.type||null,face:invoice.total,synced:invoice.synced,matched:a.matched,unmatched:a.unmatched,excess:a.excess,status:status(invoice),otherSystem:!!invoice.otherSystem,lines:invoice.lines.map(l=>({id:l.id,order:l.order,amount:l.amount,state:l.state}))};
}
function recordLedgerChange(invoice,action,actor,before){
 const after=ledgerSnapshot(invoice);if(JSON.stringify(before)===JSON.stringify(after))return;
 const changes=[];const show=v=>v===null||v===undefined?'—':money(v);
 if(!before)changes.push('台账：无 → 新建；发票号码：'+invoice.number,'台账来源：'+invoice.origin);
 if(before?.type!==after.type&&after.type)changes.push('发票类型：'+(before?.type||'空')+' → '+after.type);
 for(const [key,label]of ticketInfoFields)if(before?.info?.[key]!==after.info?.[key])changes.push(label+'：'+(before?.info?.[key]??'—')+' → '+(after.info?.[key]??'—'));
 const fields=[['face','票面含税金额'],['matched','已匹配金额'],['unmatched','未匹配金额'],['excess','登记超额']];
 for(const [key,label]of fields)if(before?.[key]!==after[key])changes.push(label+'：'+show(before?.[key])+' → '+show(after[key]));
 if(before?.synced!==after.synced)changes.push('采集状态：'+(before?(before.synced?'已采集':'待采集'):'空')+' → '+(after.synced?'已采集':'待采集'));
 if(before?.status!==after.status)changes.push('匹配状态：'+(before?.status||'空')+' → '+after.status);
 for(const line of after.lines){const old=before?.lines.find(l=>l.id===line.id&&l.order===line.order);if(!old)changes.push('新增登记：'+line.id+'；'+(line.order?'订单：'+line.order+'；':'商品登记；')+'本次金额：'+money(line.amount)+'；状态：'+line.state);else if(old.state!==line.state)changes.push('登记：'+line.id+'；处理结果：'+old.state+' → '+line.state);}
 (invoice.events??=[]).push({time:new Date().toLocaleString('zh-CN',{hour12:false}),actor,action,change:changes.join('\n')});
}
function ledgerHistory(invoice){
 const a=amounts(invoice),esc=registerEscape;
 open('台账变更记录','<div class="fields"><div>发票号码：'+esc(invoice.number)+'</div><div>开票方名称：'+esc(invoice.seller)+'</div><div>采集状态：'+(invoice.synced?'已采集':'待采集')+'</div><div>票面含税金额：'+(hasFace(invoice)?money(invoice.total):'—')+'</div><div>已匹配金额：'+money(a.matched)+'</div><div>未匹配金额：'+(a.unmatched===null?'—':money(a.unmatched))+'</div><div>登记超额：'+(!hasFace(invoice)?'票面金额待补齐，暂无法判断':a.excess?'<span class="warning">超额 '+money(a.excess)+'</span>':'未超额')+'</div></div><div class="scroll"><table class="small-table"><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>变更摘要</th></tr></thead><tbody>'+[...(invoice.events||[])].reverse().map(e=>'<tr><td>'+esc(e.time)+'</td><td>'+esc(e.actor)+'</td><td>'+esc(e.action)+'</td><td style="white-space:pre-line;min-width:440px">'+esc(e.change)+'</td></tr>').join('')+'</tbody></table></div>');
}

function linkedClick(event){
 const data=event.target.dataset;
 if(data.invoiceDetail)invoiceDetail(invoices.find(i=>i.number===data.invoiceDetail));
 if(data.ledgerHistory)ledgerHistory(invoices.find(i=>i.number===data.ledgerHistory));
 if(data.match){
 const invoice=invoices.find(i=>i.number===data.match);
 register(false,invoice);
 }
 if(data.other){
 const invoice=invoices.find(i=>i.number===data.other);
 open('标记为其他系统匹配','<p>请确认该发票已在其他系统完成业务匹配。标记后，当前系统不能继续关联登记和订单。</p>',[{label:'确认标记',primary:true,action:()=>{
 const amount=amounts(invoice);
 if(amount.matched){$('#message').textContent='发票已有登记，无法标记为其他系统匹配。';return;}
 const before=ledgerSnapshot(invoice);invoice.otherSystem=true;recordLedgerChange(invoice,'标记为其他系统匹配','张石磊',before);render();close();
 }}]);
 }
 if(data.excess)invoiceDetail(invoices.find(i=>i.number===data.excess));
 if(data.red)redDetail(invoices.find(i=>i.number===data.red));
 if(data.order)orderDetail(invoices.find(i=>i.number===data.invoice),data.order);
 if(data.line)registrationDetail(invoices.find(i=>i.number===data.invoice),data.line);
 if(data.info)invoiceDetail(invoices.find(i=>i.number===data.info));
}

function installInvoiceTooltips(){
 const tooltip=document.createElement('div');tooltip.id='invoice-tooltip';tooltip.setAttribute('role','tooltip');tooltip.hidden=true;document.body.appendChild(tooltip);
 let anchor=null;
 function hide(){if(anchor)anchor.removeAttribute('aria-describedby');anchor=null;tooltip.hidden=true;}
 function show(target){
 if(!target?.dataset.tooltip){hide();return;}
 const host=target.closest('dialog[open]')||document.body;if(tooltip.parentElement!==host)host.appendChild(tooltip);
 if(anchor&&anchor!==target)anchor.removeAttribute('aria-describedby');anchor=target;tooltip.textContent=target.dataset.tooltip;tooltip.hidden=false;target.setAttribute('aria-describedby',tooltip.id);
 const rect=target.getBoundingClientRect(),box=tooltip.getBoundingClientRect();
 const left=Math.max(12,Math.min(rect.left,window.innerWidth-box.width-12));
 const top=rect.bottom+8+box.height<window.innerHeight-12?rect.bottom+8:Math.max(12,rect.top-box.height-8);
 tooltip.style.left=left+'px';tooltip.style.top=top+'px';
 }
 document.addEventListener('pointerover',event=>show(event.target.closest?.('[data-tooltip]')));
 document.addEventListener('pointerout',event=>{const target=event.target.closest?.('[data-tooltip]');if(target&&!target.contains(event.relatedTarget))hide();});

}

// Invoice evidence remains local to this prototype. AI values are explicitly simulated.
function ticketEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openInvoiceFile(url){if(typeof url!=='string'||!url.startsWith('blob:'))return;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.dataset.invoiceFileLink='true';document.body.append(a);a.click();a.remove();}
function ticketMoney(v){return v!==''&&v!==null&&v!==undefined?money(v):'—';}
function invoiceBuyerName(i){return i.ticketInfo?.buyer||'—';}
function invoiceTicketState(i){return i.synced?(i.redForms?'部分红冲':'正常'):i.redFlag===true?'红冲':i.redFlag===false?'正常':'—';}
function ledgerTicketInfo(i){return {...(i?.ticketInfo||{})};}
function demoTicketInfo(face){const net=Math.round(Number(face)/1.13*100)/100;return {buyer:'示例采购公司',buyerTax:'91310000DEMO000001',sellerTax:'91310000DEMO000002',tax:Number((Number(face)-net).toFixed(2)),net,issuer:'示例开票人'};}
function storeTicketInfo(invoice,info,color){if(invoice.synced)return;invoice.ticketInfo={...(info||{})};invoice.redFlag=color==='红字';}
function ticketReadout(info){return '<div class="ticket-info-grid">'+ticketInfoFields.map(([key,label])=>'<div><small>'+label+'</small><span>'+registerEscape(info?.[key]!==''&&info?.[key]!==undefined&&info?.[key]!==null?(key==='tax'||key==='net'?money(info[key]):info[key]):'—')+'</span></div>').join('')+'</div>';}
function createTicketInfoPanel(host,getTarget,getNumber){
 const box=document.createElement('section');box.className='ticket-info-section';
 box.innerHTML='<button type="button" class="link ticket-info-toggle" aria-expanded="false">查看票面信息</button><div class="ticket-info-editor" hidden><div class="ticket-info-grid">'+ticketInfoFields.map(([key,label])=>'<label>'+label+'<input data-ticket-info="'+key+'" '+(['tax','net'].includes(key)?'type="number" step="0.01"':'type="text"')+'></label>').join('')+'</div><p class="subtle">用于核对整张发票，可不填写；不影响订单、商品及本次登记金额。</p></div>';
 host.append(box);const body=box.querySelector('.ticket-info-editor'),toggle=box.querySelector('button');
 toggle.onclick=()=>{body.hidden=!body.hidden;toggle.textContent=body.hidden?'查看票面信息':'收起票面信息';toggle.setAttribute('aria-expanded',String(!body.hidden));};
 let lastTarget=null,lastNumber=null;const cache=new Map();
 function sync(force=false){const target=getTarget();if(!target){box.hidden=true;return;}box.hidden=false;const number=getNumber();
  if(target!==lastTarget||number!==lastNumber){if(lastTarget&&lastNumber&&lastTarget===target)cache.set(lastNumber,{...(lastTarget.info||{})});target.info=number===lastNumber&&target.info?target.info:{...(cache.get(number)||target.infoNumber===number&&target.info||ledgerTicketInfo(invoices.find(i=>i.number===number)))};target.infoNumber=number;lastTarget=target;lastNumber=number;force=true;}
  const record=invoices.find(i=>i.number===number);if(record?.synced){target.info=ledgerTicketInfo(record);force=true;}
  for(const el of box.querySelectorAll('input')){el.readOnly=!!record?.synced;if(force||document.activeElement!==el)el.value=target.info?.[el.dataset.ticketInfo]??'';}
 }
 box.addEventListener('input',e=>{if(!e.target.dataset.ticketInfo)return;const t=getTarget();if(!t||e.target.readOnly)return;(t.info??={})[e.target.dataset.ticketInfo]=e.target.value;t.infoNumber=getNumber();});
 return {element:box,sync,apply(data){sync();const t=getTarget();if(!t||invoices.find(i=>i.number===getNumber())?.synced)return;for(const [k]of ticketInfoFields)if(data[k]!==undefined)(t.info??={})[k]=data[k];t.infoNumber=getNumber();sync(true);},demo(face){this.apply(demoTicketInfo(face));}};
}
function registrationFileLink(invoice,line){
 const meta=line.registrationMeta,card=meta?.cards?.find(c=>c.number===invoice.number);
 if(card?.file)return '<br><button class="link ledger-registration-file" data-ticket-file="'+ticketEscape(invoice.number)+'" data-ticket-registration="'+ticketEscape(line.id)+'">发票文件</button>';
 if(!meta?.cards)return '<br><button class="link ledger-registration-file" data-ticket-history="'+ticketEscape(invoice.number)+'" data-ticket-registration="'+ticketEscape(line.id)+'">历史附件</button>';
 return '';
}
function showRegistrationFile(invoice,id){const card=invoice.lines.find(l=>l.id===id)?.registrationMeta?.cards?.find(c=>c.number===invoice.number);if(card?.url){openInvoiceFile(card.url,'_blank','noopener');return;}notice('该登记仅保存了文件记录，请从登记详情核对附件。');}
function collectionFileHTML(invoice){const f=invoice.collectionFiles?.pdf;return f?'<button class="link" data-collected-pdf="'+ticketEscape(invoice.number)+'">'+registerEscape(f.name)+'</button>':'—';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ticket-file],[data-ticket-history],[data-collected-pdf]');if(!b)return;const i=invoices.find(i=>i.number===(b.dataset.ticketFile||b.dataset.ticketHistory||b.dataset.collectedPdf));if(!i)return;if(b.hasAttribute('data-collected-pdf')){const f=i.collectionFiles?.pdf;if(f?.url)openInvoiceFile(f.url,'_blank','noopener');}else if(b.hasAttribute('data-ticket-history'))registrationDetail(i,b.dataset.ticketRegistration);else showRegistrationFile(i,b.dataset.ticketRegistration);});
const ticketBaseRegistrationDetail=registrationDetail;
registrationDetail=function(invoice,id){ticketBaseRegistrationDetail(invoice,id);const meta=invoice.lines.find(l=>l.id===id)?.registrationMeta;const cards=meta?.cards||[];if(!cards.length)return;const section=document.createElement('section');section.className='ticket-detail-section';section.innerHTML=cards.length?cards.map((c,n)=>'<div class="ticket-info-section"><button class="link" data-detail-ticket="'+n+'" aria-expanded="false">查看票面信息 · '+registerEscape(c.number)+'</button><div hidden>'+ticketReadout(c.info)+'<p class="subtle">本次登记保存的票面信息；最新信息在台账查看。</p></div></div>').join(''):'<p class="subtle">历史发票原件保留在上方附件中；没有独立票面记录的字段不补填。</p>';$('#content').append(section);section.querySelectorAll('[data-detail-ticket]').forEach(b=>b.onclick=()=>{const panel=b.nextElementSibling;panel.hidden=!panel.hidden;b.setAttribute('aria-expanded',String(!panel.hidden));});};
const ticketStyles=document.createElement('style');ticketStyles.textContent='.ticket-info-section{padding:10px 0 18px;border-bottom:1px solid #e0e8f0;margin-bottom:16px}.ticket-info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:16px 0}.ticket-info-grid label{display:flex;flex-direction:column;gap:8px;color:#637e97}.ticket-info-grid input{box-sizing:border-box;width:100%;min-width:0}.ticket-info-grid small{display:block;color:#7b8fa2;margin-bottom:8px}.ticket-info-grid span{overflow-wrap:anywhere}.ticket-info-editor[hidden]{display:none}.ledger-registration-file{font-size:12px}.ticket-detail-section{margin-top:18px}@media(max-width:800px){.ticket-info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.ticket-info-grid{grid-template-columns:1fr}}';document.head.append(ticketStyles);
// This is a mock Kingdee PDF for a seeded demonstration invoice only.
{const sample=invoices.find(i=>i.number==='26312000000000861352');if(sample){const file=makeDemoInvoiceFile(sample.number,sample.total);sample.collectionFiles={pdf:{name:'采集原票（示例）.pdf',url:URL.createObjectURL(file)}};sample.ticketInfo=demoTicketInfo(sample.total);}}

function installDefaultInvoiceAI({host,button,getTarget,getForm,apply}){
 const bar=document.createElement('div');bar.className='invoice-ai-bar';
 bar.innerHTML='<span data-ai-status role="status"></span><button type="button" class="link" data-ai-view hidden>查看识别内容</button><span data-ai-hint></span><div data-ai-result hidden></div>';
 host.append(bar);const status=bar.querySelector('[data-ai-status]'),view=bar.querySelector('[data-ai-view]'),hint=bar.querySelector('[data-ai-hint]'),resultBox=bar.querySelector('[data-ai-result]');let generation=0;
 function paint(){const target=getTarget(),ai=target?.ai;bar.hidden=!target?.file;button.textContent='重新识别';button.hidden=!target?.file;button.disabled=ai?.status==='pending';view.hidden=ai?.status!=='success';view.setAttribute('aria-expanded',String(!resultBox.hidden));status.textContent=ai?.status==='pending'?'正在识别…':ai?.status==='success'?'识别完成':ai?.status==='failed'?'识别失败，可手工填写':'';hint.textContent=ai?.status==='failed'?'':'';resultBox.hidden=true;}
 function showResult(){const ai=getTarget()?.ai;if(ai?.status!=='success')return;resultBox.hidden=!resultBox.hidden;view.setAttribute('aria-expanded',String(!resultBox.hidden));if(resultBox.hidden)return;
 const raw=ai.result;const values=[['发票号码',raw.number],['销售方名称',raw.seller],['开票日期',raw.date],['发票代码',raw.code],['票面含税金额',raw.face],['整票税额',raw.tax],['整票不含税金额',raw.net],['销售方税号',raw.sellerTax],['购买方名称',raw.buyer],['购买方税号',raw.buyerTax],['开票人',raw.issuer],['红字信息',raw.color]];
 resultBox.innerHTML='<div class="ticket-info-grid">'+values.map(([name,value])=>'<div><small>'+name+'</small><span>'+ticketEscape(value!==''&&value!==null&&value!==undefined?value:'未识别')+'</span></div>').join('')+'</div><p class="subtle">本次AI返回的识别内容，供核对；修改后的信息以发票字段为准。</p>';
 }
 view.onclick=showResult;
 function upload(data){const target=getTarget();if(!target)return;const ticket=++generation;target.ai={status:'pending',result:null};paint();setTimeout(()=>{if(ticket!==generation||!target.file)return;target.ai=data?{status:'success',result:{...data}}:{status:'failed',result:null};paint();},450);}
 function retry(){const target=getTarget();if(!target?.file)return;const file=target.file,ticket=++generation,form=getForm(),ownDialog=!$('#dialog').open;if(ownDialog)open('重新识别当前发票','',[{label:'返回批量登记',action:close}]);recognitionPreview(form,data=>{if(ticket!==generation||target.file!==file)return;const previous=target.ai;target.ai={status:'success',result:{...data}};const accepted=apply(data);if(accepted===false)target.ai=previous;paint();if(ownDialog)close();});if(ownDialog)$('#dialog [data-cancel]')?.addEventListener('click',close);}
 button.onclick=retry;
 return {upload,retry,sync:paint,reset(){generation++;const target=getTarget();if(target)target.ai=null;paint();}};
}
function applyBulkRecognition(r,data){const i=invoices.find(i=>i.number===data.number);r.number=data.number||r.number;r.date=data.date||r.date;r.code=data.code||r.code;r.invoiceSeller=data.seller||r.invoiceSeller;if(!r.supplier&&data.seller)r.supplier=data.seller;if(i&&hasFace(i)){r.face=i.total;r.aiWarning=Number(data.face)!==Number(i.total)?i.synced?'识别金额与已采集金额不一致，以采集金额为准。':'识别金额与已有票面金额不一致，请核对并更正。':'';}else if(data.face!=='')r.face=Number(data.face);if(!i?.synced){r.info={...(r.info||{})};for(const [k]of ticketInfoFields)if(data[k]!==undefined)r.info[k]=data[k];r.infoNumber=r.number;}r.lastLookup=r.number;drawBatchCards();return true;}
